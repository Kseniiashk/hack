# Экономические допущения для оценки Value (KPI-эффекта).
# ВНИМАНИЕ: цены условные, для оценки порядка эффекта. Настраиваются в UI.
prices_usd_per_t:
  Ni: 15000
  Cu: 8500

# Курс для отображения в рублях (опционально).
usd_rub: 90

notes: >
  Value гипотезы = effect_frac * (извлекаемый потерянный металл целевого класса, т) * цена.
  Это оценка «сверху» при заявленной доле отыгрыша. Указывать как диапазон и допущение.
