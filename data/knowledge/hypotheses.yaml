# Каталог гипотез-вмешательств (интерпретируемая доменная база знаний).
#
# Каждая карточка — проверяемое инженерное вмешательство во flowsheet обогащения.
# Карточки покрывают все эталонные гипотезы из «Гипотезы …docx» и обобщают их.
#
# Поля:
#   id           — стабильный идентификатор
#   title        — формулировка гипотезы (в лексике эталонов)
#   triggers     — коды находок Diagnostic Engine, при которых гипотеза релевантна
#   size_scope   — классы крупности, для которых гипотеза осмысленна ([] = любой)
#   mechanism    — физический механизм влияния на целевой KPI
#   equipment    — задействованное оборудование (из регламентов)
#   stage        — передел: измельчение / классификация / флотация / дробление
#   feasibility  — базовая реализуемость 0..1 (насколько легко внедрить)
#   novelty      — базовая новизна 0..1 (0=рутина, 1=нестандартно для отрасли)
#   risk_tech    — технический риск 0..1
#   risk_econ    — экономический риск 0..1 (капзатраты/простой)
#   effect_frac  — оценочная доля отыгрываемых потерь целевого класса 0..1 (для Value)
#   refs         — разделы корпуса для RAG-обоснования (ключевые фразы)
#   success      — критерий успеха проверки
#   roadmap      — короткая дорожная карта проверки

hypotheses:

