      Профиль футеровки задаёт траекторию и энергию ударного/истирающего
      воздействия шаров. Оптимизация профиля повышает долю раскрытия сростков
      Pnt/Cp без роста переизмельчения, снижая закрытый металл в крупных классах.
    equipment: [МШРГУ 4.5×6.0, МШР 3.2×3.8, МШЦ]
    stage: измельчение
    feasibility: 0.7
    novelty: 0.35
    risk_tech: 0.3
    risk_econ: 0.3
    effect_frac: 0.25
    refs: ["футеровка мельниц раскрытие", "шаровое измельчение раскрытие сростков"]
    success: >
      Снижение доли закрытого Pnt/Cp в классах +71/-71+45 на ≥15% отн. при
      неизменной доле класса -10 мкм.
    roadmap:
      - Аудит текущего профиля футеровки и износа
      - Подбор профиля (расчёт траекторий шаров / моделирование)
